workflows:
  ios-alnoorway-auto:
    name: AlNoorway iOS Auto Flow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: noourway

    # ✅ استخدام قسم ios_signing الرسمي من Codemagic للتوقيع التلقائي
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alnoorway.codexus.app
      vars:
        # ✅ استخدام Workspace بدلاً من Project لتجنب أخطاء بناء Capacitor
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_ID: "6762559077"
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Build web app and Sync
        script: |
          npm run build
          npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Publish to App Store Connect
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          app-store-connect publish \
            --path "$IPA_PATH" \
            --apple-id "$APP_ID"

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - osakr100@gmail.com
          - ahmedmustafa0384@gmail.com

workflows:
  ios-alnoorway-manual:
    name: AlNoorway iOS Manual Flow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: noourway

    environment:
      ios_signing:
        provisioning_profiles:
          - ios_profile_manual
        certificates:
          - ios_cert_manual
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_ID: "6762559077"
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Build web app and Sync
        script: |
          npm run build
          npx cap sync ios

      - name: Clean CocoaPods and Resolve SPM
        script: |
          cd ios/App
          # مسح أي ملفات قديمة تسبب تعارض
          rm -rf Podfile Podfile.lock Pods App.xcworkspace
          # تحميل مكتبات جوجل وأبل بالنظام الجديد إجبارياً
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Publish to App Store Connect
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          app-store-connect publish \
            --path "$IPA_PATH" \
            --apple-id "$APP_ID"

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - codexus.eg@gmail.com
